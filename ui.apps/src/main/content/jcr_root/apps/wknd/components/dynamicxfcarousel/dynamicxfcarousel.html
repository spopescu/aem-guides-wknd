<sly data-sly-test.isAuthor="${wcmmode.edit || wcmmode.preview}"/>

<script>
    var baseXFpath = '/content/experience-fragments/wknd/us/en/';
    var dynamicXFCarouselPaths = [];
    var isAuthorMode = ${isAuthor @ context='scriptString'};

    function makeRelativeToBase(fullPath, basePath) {
        if (fullPath && fullPath.indexOf(basePath) === 0) {
            return fullPath.substring(basePath.length);
        }
        return fullPath;
    }
</script>
<sly data-sly-list.xfItem="${resource.listChildren}">
    <sly data-sly-test="${xfItem.name == 'xfPaths'}">
        <sly data-sly-list.pathItem="${xfItem.listChildren}">
            <script>dynamicXFCarouselPaths.push(makeRelativeToBase('${pathItem.valueMap.xfPath @ context="scriptString"}', baseXFpath));</script>
        </sly>
    </sly>
</sly>

<!-- Carousel container - will be populated by JavaScript -->
<div class="cmp-carousel cmp-carousel--dynamic"
     data-dynamic-xf-carousel
     role="group"
     aria-roledescription="carousel">

    <!-- Loading indicator -->
    <div class="cmp-carousel__loading">
        <p>Loading carousel...</p>
    </div>
</div>

<!-- Client-side carousel initialization script -->
<script>
(function() {
    'use strict';

    var baseUrl = window.llmApps ? window.llmApps.aemBaseUrl || '' : '';

    // Author mode: use preview XFs from dialog immediately
    if (isAuthorMode) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDynamicCarousel);
        } else {
            initDynamicCarousel();
        }
    } else {
        // Publish mode: wait for dynamic data from external source
        const onDataLoaded = new Promise((resolve) => {
            if (window.openai?.toolOutput) {
                // Already available
                resolve(window.openai.toolOutput);
            } else {
                // Wait for the event
                window.addEventListener('openai:set_globals', () => {
                    // eslint-disable-next-line no-console
                    console.log('OpenAI tool output', window.openai.toolOutput);
                    resolve(window.openai.toolOutput);
                }, { once: true });
            }
        });

        onDataLoaded.then((data) => {
            console.log('on data loaded', data);
            const experienceData = data?.structuredContent?.experiences || data?.experiences;
            // Override dynamicXFCarouselPaths with dynamic data if available
            if (experienceData && Array.isArray(experienceData)) {
                dynamicXFCarouselPaths = experienceData;
            }
            initDynamicCarousel();
        });
    }

    function initDynamicCarousel() {
        var carouselContainer = document.querySelector('[data-dynamic-xf-carousel]');

        if (!carouselContainer) {
            console.warn('Dynamic XF Carousel container not found');
            return;
        }

        if (typeof dynamicXFCarouselPaths === 'undefined' || !dynamicXFCarouselPaths || dynamicXFCarouselPaths.length === 0) {
            console.warn('No XF paths configured for carousel');
            showError(carouselContainer, 'No Experience Fragment paths configured. Please configure XFs in the component dialog.');
            return;
        }

        // Parse XF paths (could be array, string, or comma-separated)
        var paths = parseXFPaths(dynamicXFCarouselPaths);

        if (paths.length === 0) {
            console.warn('No valid XF paths found');
            showError(carouselContainer, 'No valid Experience Fragment paths');
            return;
        }

        console.log('Loading ' + paths.length + ' Experience Fragments for carousel');
        console.log('XF paths:', paths);

        // Ensure paths have /master suffix
        var fullPaths = paths.map(function(path) {
            var resolved = ensureMasterPath(path);
            console.log('Resolved:', path, '->', resolved);
            return resolved;
        });

        console.log('Full paths to load:', fullPaths);

        // Load all XFs and build carousel
        loadExperienceFragments(fullPaths, carouselContainer);
    }

    function parseXFPaths(value) {
        var paths = [];

        if (Array.isArray(value)) {
            paths = value;
        } else if (typeof value === 'string') {
            if (value.indexOf(',') !== -1) {
                // Comma-separated
                paths = value.split(',').map(function(p) { return p.trim(); });
            } else {
                // Single value
                paths = [value.trim()];
            }
        }

        // Filter empty paths and prepend baseXFpath to all paths
        return paths
            .filter(function(p) { return p && p.length > 0; })
            .map(function(p) { return baseXFpath + p; });
    }

    function ensureMasterPath(xfPath) {
        // XF paths from dialog are full paths, just ensure they have /master suffix
        var path = xfPath.trim();

        // Remove trailing slashes
        path = path.replace(/\/+$/, '');

        // Add /master suffix if not present
        if (!path.endsWith('/master')) {
            path += '/master';
        }

        return path;
    }

    function makePathsAbsolute(html) {
        // Create a temporary div to parse HTML
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;

        // Find all elements with src, href, or data-cmp-src attributes
        var attributesToFix = ['src', 'href', 'data-cmp-src', 'data-src'];

        attributesToFix.forEach(function(attr) {
            var elements = tempDiv.querySelectorAll('[' + attr + ']');
            elements.forEach(function(element) {
                var value = element.getAttribute(attr);
                // Check if path starts with /content/
                if (value && value.indexOf('/content/') === 0) {
                    // Convert to absolute URL
                    element.setAttribute(attr, baseUrl + value);
                }
            });
        });

        // Handle srcset attribute (can have multiple URLs)
        var srcsetElements = tempDiv.querySelectorAll('[srcset]');
        srcsetElements.forEach(function(element) {
            var srcset = element.getAttribute('srcset');
            if (srcset) {
                // Replace all /content/ paths in srcset
                var newSrcset = srcset.replace(/\/content\/[^\s,]+/g, function(match) {
                    return baseUrl + match;
                });
                element.setAttribute('srcset', newSrcset);
            }
        });

        return tempDiv.innerHTML;
    }

    function loadExperienceFragments(paths, container) {
        var loadedCount = 0;
        var xfContents = new Array(paths.length);

        paths.forEach(function(path, index) {
            // Fetch XF content
            fetch(path + '.html')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Failed to load XF: ' + path);
                    }
                    return response.text();
                })
                .then(function(html) {
                    // Convert relative paths to absolute URLs
                    var processedHtml = makePathsAbsolute(html);
                    xfContents[index] = processedHtml;
                    loadedCount++;

                    if (loadedCount === paths.length) {
                        // All XFs loaded, build carousel
                        buildCarousel(xfContents, container);
                    }
                })
                .catch(function(error) {
                    console.error('Error loading XF:', path, error);
                    xfContents[index] = '<div class="cmp-carousel__error">Failed to load content</div>';
                    loadedCount++;

                    if (loadedCount === paths.length) {
                        buildCarousel(xfContents, container);
                    }
                });
        });
    }

    function buildCarousel(xfContents, container) {
        // Build carousel HTML
        var carouselHTML = '<div class="cmp-carousel__content" aria-atomic="false" aria-live="polite">';

        xfContents.forEach(function(content, index) {
            var isActive = index === 0 ? ' cmp-carousel__item--active' : '';
            carouselHTML += '<div class="cmp-carousel__item' + isActive + '" ' +
                           'role="tabpanel" ' +
                           'aria-label="Slide ' + (index + 1) + ' of ' + xfContents.length + '" ' +
                           'data-cmp-hook-carousel="item">' +
                           '<div class="cmp-carousel__xf-item">' + content + '</div>' +
                           '</div>';
        });

        carouselHTML += '</div>';

        // Add indicators if more than one item
        if (xfContents.length > 1) {
            carouselHTML += '<ol class="cmp-carousel__indicators">';
            xfContents.forEach(function(content, index) {
                var isActive = index === 0;
                carouselHTML += '<li class="cmp-carousel__indicator' + (isActive ? ' cmp-carousel__indicator--active' : '') + '" ' +
                               'role="tab" ' +
                               'aria-label="Slide ' + (index + 1) + '" ' +
                               'aria-selected="' + isActive + '" ' +
                               'tabindex="' + (isActive ? '0' : '-1') + '" ' +
                               'data-cmp-hook-carousel="indicator"></li>';
            });
            carouselHTML += '</ol>';

            // Add navigation buttons
            carouselHTML += '<div class="cmp-carousel__actions">' +
                           '<button class="cmp-carousel__action cmp-carousel__action--previous" type="button" aria-label="Previous" data-cmp-hook-carousel="previous">' +
                           '<span class="cmp-carousel__action-icon" aria-hidden="true"></span>' +
                           '<span class="cmp-carousel__action-text">Previous</span>' +
                           '</button>' +
                           '<button class="cmp-carousel__action cmp-carousel__action--next" type="button" aria-label="Next" data-cmp-hook-carousel="next">' +
                           '<span class="cmp-carousel__action-icon" aria-hidden="true"></span>' +
                           '<span class="cmp-carousel__action-text">Next</span>' +
                           '</button>' +
                           '</div>';
        }

        // Replace loading indicator with carousel
        container.innerHTML = carouselHTML;
        container.setAttribute('data-cmp-is', 'carousel');
        container.setAttribute('data-cmp-delay', '5000');

        console.log('Dynamic XF Carousel built with ' + xfContents.length + ' items');

        // Initialize simple carousel navigation
        if (xfContents.length > 1) {
            initSimpleCarousel(container);
        }
    }

    function initSimpleCarousel(container) {
        var items = container.querySelectorAll('.cmp-carousel__item');
        var indicators = container.querySelectorAll('.cmp-carousel__indicator');
        var prevBtn = container.querySelector('[data-cmp-hook-carousel="previous"]');
        var nextBtn = container.querySelector('[data-cmp-hook-carousel="next"]');
        var currentIndex = 0;

        function showSlide(index) {
            // Hide all items
            items.forEach(function(item) {
                item.classList.remove('cmp-carousel__item--active');
            });

            // Deactivate all indicators
            indicators.forEach(function(indicator) {
                indicator.classList.remove('cmp-carousel__indicator--active');
                indicator.setAttribute('aria-selected', 'false');
                indicator.setAttribute('tabindex', '-1');
            });

            // Show current item
            items[index].classList.add('cmp-carousel__item--active');

            // Activate current indicator
            if (indicators[index]) {
                indicators[index].classList.add('cmp-carousel__indicator--active');
                indicators[index].setAttribute('aria-selected', 'true');
                indicators[index].setAttribute('tabindex', '0');
            }

            currentIndex = index;
        }

        function nextSlide() {
            var next = (currentIndex + 1) % items.length;
            showSlide(next);
        }

        function prevSlide() {
            var prev = (currentIndex - 1 + items.length) % items.length;
            showSlide(prev);
        }

        // Add event listeners
        if (nextBtn) {
            nextBtn.addEventListener('click', nextSlide);
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', prevSlide);
        }

        // Indicator clicks
        indicators.forEach(function(indicator, index) {
            indicator.addEventListener('click', function() {
                showSlide(index);
            });
        });

        // Auto-play
        var autoplayInterval = setInterval(nextSlide, 5000);

        // Pause on hover
        container.addEventListener('mouseenter', function() {
            clearInterval(autoplayInterval);
        });

        container.addEventListener('mouseleave', function() {
            autoplayInterval = setInterval(nextSlide, 5000);
        });

        console.log('Simple carousel initialized with ' + items.length + ' slides');
    }

    function showError(container, message) {
        container.innerHTML = '<div class="cmp-carousel__error"><p>' + message + '</p></div>';
    }
})();
</script>
